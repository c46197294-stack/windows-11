name: Build Desktop Samsung APK (release assinado)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar versao web
        run: npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar configuracao Android
        run: cp capacitor.config.example.json capacitor.config.json

      - name: Adicionar plataformas Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      # Espelho do Maven Central para tentar contornar erros HTTP 403.
      - name: Corrigir acesso ao Maven Central (espelho)
        run: |
          cat > mirror.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven {
                          url 'https://maven-central.storage-download.googleapis.com/maven2/'
                      }
                  }
              }
              repositories {
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2/'
                  }
              }
          }
          settingsEvaluated { s ->
              s.pluginManagement.repositories {
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2/'
                  }
              }
          }
          EOF

      # kotlin-stdlib 1.8.22 (do AGP) conflita com kotlin-stdlib-jdk7/jdk8 1.6.21 (do Capacitor).
      - name: Corrigir classes duplicadas do Kotlin
        run: |
          cat >> android/app/build.gradle <<'EOF'
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
              }
          }
          EOF

      # Mesma chave em TODOS os builds futuros: atualiza o app instalado normalmente.
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/desktop-samsung.jks
          test -s /tmp/desktop-samsung.jks

      - name: Definir versao (versionCode 2 / versionName 1.1)
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      - name: Gerar APK
        run: cd android && ./gradlew assembleDebug --init-script ../mirror.gradle --stacktrace

      - name: Assinar APK com a chave definitiva
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          $APKSIGNER sign \
            --ks /tmp/desktop-samsung.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out desktop-samsung-v1.1.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER verify --print-certs desktop-samsung-v1.1.apk

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: desktop-samsung-apk-v1.1
          path: desktop-samsung-v1.1.apk
