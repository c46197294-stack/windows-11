name: Build Windows 11 King Maple APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Compilar versão web
        run: npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar configuração Android
        run: cp capacitor.config.example.json capacitor.config.json

      - name: Adicionar plataformas Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      # Espelho do Maven Central para tentar contornar erros HTTP 403.
      - name: Corrigir acesso ao Maven Central (espelho)
        run: |
          cat > mirror.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven {
                          url 'https://maven-central.storage-download.googleapis.com/maven2/'
                      }
                  }
              }
              repositories {
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2/'
                  }
              }
          }
          settingsEvaluated { s ->
              s.pluginManagement.repositories {
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2/'
                  }
              }
          }
          EOF

      # kotlin-stdlib 1.8.22 (do AGP) conflita com kotlin-stdlib-jdk7/jdk8 1.6.21 (do Capacitor).
      # Constraints alinham os artefatos jdk7/jdk8 a 1.8.22 (correcao documentada pelo Google).
      - name: Corrigir classes duplicadas do Kotlin
        run: |
          cat >> android/app/build.gradle <<'EOF'
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
              }
          }
          EOF

      - name: Gerar APK
        run: cd android && ./gradlew assembleDebug --init-script ../mirror.gradle --stacktrace

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
