name: Build Windows 11 King Maple APK
on: 
workflow_dispatch:
push:
branches: ["main"]

jobs: 
build-apk:
runs-on: ubuntu-latest 
steps: 
- name: Baixar o código do projeto uses: actions/checkout@v4 
- name: Configurar Node.js 
uses: actions/setup-node@v4 
with: node-version: "20" 
cache: npm 
name: Instalar dependências run: npm ci 
name: Compilar o projeto web run: npm run build 
 name: Enviar arquivos compilados 
uses: actions/upload-artifact@v4 
with:
name: windows-11-king-maple-web path: dist/
