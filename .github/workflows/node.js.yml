Escrita
name: Build Windows 11 King Maple APK
on: workflow_dispatch: push: branches: - main
jobs: build-apk: runs-on: ubuntu-latest
steps:
  - name: Baixar o projeto
    uses: actions/checkout@v4

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm

  - name: Instalar dependências
    run: npm ci

  - name: Compilar versão web
    run: npm run build

  - name: Instalar Capacitor
    run: npm install @capacitor/core @capacitor/cli @capacitor/android

  - name: Preparar configuração Android
    run: |
      if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
        npx cap init "Windows 11 King Maple" com.kingmaple.windows11 --web-dir=dist
      fi

  - name: Adicionar Android
    run: npx cap add android

  - name: Sincronizar Android
    run: npx cap sync android

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Diagnosticar dependências Kotlin
    continue-on-error: true
    run: |
      cd android
      ./gradlew buildEnvironment

  - name: Gerar APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: Windows-11-King-Maple-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
